server.port=8080

# Frontend ka address (comma se alag karo). Live pe apna domain daalo.
app.cors.origins=http://localhost:5173,http://localhost:3000,https://newrunboth-1.onrender.com
# Nginx/Cloudflare ke peeche ho to true karo (tab real IP X-Forwarded-For se aati hai)
app.trust-proxy=false

# yt-dlp
ytdlp.path=yt-dlp
# Optional: Instagram login cookies (cookies.txt). Alag/fake account ka hi use karo.
ytdlp.cookies=
# ffmpeg PATH me na mile to uska poora path/folder yahan do (slashes / rakho)
ytdlp.ffmpeg-location=
ytdlp.max-concurrent=3
ytdlp.max-filesize=2G

# Razorpay (https://dashboard.razorpay.com). Secrets ko environment variable se do, git me mat daalo.
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_xxxxxxxx}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:change_me}

# Premium token signing secret: kam se kam 32 random characters
premium.token-secret=${PREMIUM_TOKEN_SECRET:CHANGE_ME_TO_A_LONG_RANDOM_STRING_32_PLUS}
premium.price-paise=1900
premium.days=30

# Rate limit (per IP, per minute)
ratelimit.info-per-minute=30
ratelimit.download-per-minute=5
ratelimit.order-per-minute=10
